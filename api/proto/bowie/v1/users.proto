syntax = "proto3";

package storage.v1;

option go_package = "bowie/v1";

message Users {
  string id = 1;
  string email = 2;
  int32 profile_picture = 3;
  string username = 4;
}

message CreateUserRequest {
  string email = 1;
  int32 profile_picture = 2;
  string username = 3;
}

message CreateUserResponse {
  Users user = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByEmailResponse {
  Users user = 1;
}
